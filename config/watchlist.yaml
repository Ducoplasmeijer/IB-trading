# Metals shown on the dashboard, grouped per metal. Safe to commit (no account data).
#
# group.reference: product used as the metal's price benchmark (spot where IB has it, else the front future)
# group.unit:      unit of the reference price (oz, lb, t)
# product.kind:    spot | future | etf   (etf = any exchange-traded fund/ETC)
# product.contract: fields for an ib_async Contract. CONTFUT is resolved to the current front month.
# Cost assumptions are ESTIMATES for comparison. Check them against your own IBKR tier:
#   https://www.interactivebrokers.com/en/pricing/commissions-home.php
#   commission: per_unit, pct (of notional), min, max_pct   -- per side, in the product's currency
#   typical_spread: bid/ask spread used when there is no live quote (market closed / no subscription)
#   expense_ratio: annual fund fee (verify on the issuer's site)
#   rolls_per_year: futures only
# Note: IBKR has no LME access, so nickel is only available via ETCs here.

fx:
  contract: {secType: CASH, symbol: EUR, currency: USD, exchange: IDEALPRO}

groups:
  - name: Gold
    unit: oz
    reference: XAUUSD
    products:
      - {key: XAUUSD, name: Gold spot, kind: spot, what_to_show: MIDPOINT, typical_spread: 0.30,
         contract: {secType: CMDTY, symbol: XAUUSD, exchange: SMART, currency: USD}}
      - {key: GC, name: COMEX Gold future (100 oz), kind: future, multiplier: 100, typical_spread: 0.10,
         rolls_per_year: 6, commission: {per_unit: 2.40},
         contract: {secType: CONTFUT, symbol: GC, exchange: COMEX, currency: USD}}
      - {key: MGC, name: COMEX Micro Gold future (10 oz), kind: future, multiplier: 10, typical_spread: 0.10,
         rolls_per_year: 6, commission: {per_unit: 0.85},
         contract: {secType: CONTFUT, symbol: MGC, exchange: COMEX, currency: USD}}
      - {key: GLD, name: SPDR Gold Shares, kind: etf, typical_spread: 0.02, expense_ratio: 0.0040,
         commission: {per_unit: 0.005, min: 1.0, max_pct: 0.01},
         contract: {secType: STK, symbol: GLD, exchange: SMART, currency: USD}}
      - {key: IAU, name: iShares Gold Trust, kind: etf, typical_spread: 0.01, expense_ratio: 0.0025,
         commission: {per_unit: 0.005, min: 1.0, max_pct: 0.01},
         contract: {secType: STK, symbol: IAU, exchange: SMART, currency: USD}}
      - {key: GLDM, name: SPDR Gold MiniShares, kind: etf, typical_spread: 0.01, expense_ratio: 0.0010,
         commission: {per_unit: 0.005, min: 1.0, max_pct: 0.01},
         contract: {secType: STK, symbol: GLDM, exchange: SMART, currency: USD}}
      - {key: 4GLD, name: Xetra-Gold (EUR), kind: etf, typical_spread: 0.05, expense_ratio: 0.0030,
         commission: {pct: 0.0005, min: 3.0},
         contract: {secType: STK, symbol: 4GLD, exchange: IBIS, currency: EUR}}

