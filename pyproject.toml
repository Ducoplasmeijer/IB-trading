[project]
name = "ibtrader"
version = "0.1.0"
description = "Personal Interactive Brokers trading toolkit: portfolio overview, guarded order entry, option spreads."
requires-python = ">=3.11"
dependencies = [
    "ib_async>=2.1,<3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "rich>=13",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.7"]

[project.scripts]
ibt = "ibtrader.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ibtrader.dashboard" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
